    <!-- Bridge pillars -->
    <rect x="-12.959999999999999" y="3.6" width="1.44" height="5.76" fill="white" rx="0.72"/>
    <rect x="11.52" y="3.6" width="1.44" height="5.76" fill="white" rx="0.72"/>
    
    <!-- Creative sparkles -->
    <circle cx="-3.6" cy="-18" r="1.08" fill="white" opacity="0.8"/>
    <circle cx="5.76" cy="-20.160000000000004" r="0.72" fill="white" opacity="0.6"/>
