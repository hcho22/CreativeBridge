
<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A65F2;stop-opacity:0.1" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>
  
  <!-- Main content centered -->
  <g transform="translate(540, 960)">
    <!-- App icon -->
    <g transform="translate(0, -150)">
      <circle r="80" fill="url(#grad)" filter="url(#glow)"/>
      <text font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" dy="0.35em">CB</text>
    </g>
    
    <!-- App name -->
    <text font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#4A65F2" text-anchor="middle" dy="0em">CreativeBridge</text>
    
    <!-- Tagline -->
    <text font-family="Arial, sans-serif" font-size="18" fill="#2D3436" text-anchor="middle" dy="40">Where Stories Come Alive</text>
    
    <!-- Loading indicator area -->
    <g transform="translate(0, 120)">
      <rect x="-100" y="-2" width="200" height="4" rx="2" fill="#4A65F2" opacity="0.2"/>
      <rect x="-100" y="-2" width="60" height="4" rx="2" fill="#4A65F2">
        <animateTransform 
          attributeName="transform" 
          type="translate" 
          values="-100,0; 140,0; -100,0" 
          dur="2s" 
          repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- Decorative elements -->
    <circle cx="-200" cy="-300" r="3" fill="#9C88FF" opacity="0.6"/>
    <circle cx="180" cy="-280" r="2" fill="#6B73FF" opacity="0.5"/>
    <circle cx="-150" cy="250" r="4" fill="#4A65F2" opacity="0.4"/>
    <circle cx="220" cy="200" r="2.5" fill="#9C88FF" opacity="0.6"/>
  </g>
</svg>