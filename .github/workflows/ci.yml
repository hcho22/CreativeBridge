name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Convex's `_generated/` directory is gitignored (auto-generated by
      # `npx convex dev`) but its types are imported by src/ files, so tsc
      # needs them present. `convex codegen` writes the .d.ts bindings from
      # the local schema before attempting a deployment-state download —
      # the files we need are produced even if the network step fails, so
      # `|| true` keeps CI green when CONVEX_DEPLOYMENT isn't configured
      # as a secret. (US-008.)
      - name: Generate Convex types
        run: npx convex codegen --typecheck disable || true

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npx eslint . --max-warnings 750

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,tsx,json}"

      - name: Run tests
        run: npm test -- --coverage --watchAll=false